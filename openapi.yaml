openapi: 3.1.1
info:
  title: fb-marketing-server API
  version: 1.0.0
  summary: Private OpenClaw-to-Meta Ads service contract
  description: |
    Business API for explicitly scoped Meta Ads reads and human-approved mutations.
    OpenClaw is the sole caller. Meta credentials, arbitrary Graph forwarding, delete,
    public renewal, Google Drive, remote URL, and filesystem-path APIs are excluded.
    Meta Marketing API v26.0 is pinned for MVP; upgrades are planned and validated.
    Every Meta call appends redacted audit metadata with its request correlation ID.
servers:
  - url: http://127.0.0.1:3000
    description: Loopback-only local service
tags:
  - name: Health
  - name: Discovery
  - name: Diagnostics
  - name: Reporting
  - name: Media
  - name: Operations
paths:
  /health:
    get:
      tags: [Health]
      summary: Check process health
      operationId: getHealth
      x-requirements: [SEC-1, NFR-10]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Process is available; no integration details are inspected or returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/scopes:
    get:
      tags: [Discovery]
      summary: List authorized client and Ad Account pairs
      description: |
        Unscoped discovery exception. Returns only resolved pairs authorized for the
        authenticated caller. A cursor is bound to caller, filters, and request hash;
        reuse with a different binding returns 400.
      operationId: listScopes
      x-requirements: [FR-1, FR-2, FR-3, NFR-8]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authorized resolved scope page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/integration-status:
    get:
      tags: [Diagnostics]
      summary: Get safe integration diagnostics
      description: |
        Unscoped discovery exception. Optional client_id and ad_account_id must be
        supplied together; when absent, returns safe integration-level diagnostics.
        Diagnosed Meta configuration, reauthorization, asset-access, and permission
        states are successful 200 responses. Only local caller authorization uses 403.
        Any validation Meta call and normalized outcome are audited.
      operationId: getIntegrationStatus
      x-requirements: [FR-9, FR-11, SEC-7, SEC-8]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/OptionalClientIdQuery"
        - $ref: "#/components/parameters/OptionalAdAccountIdQuery"
      responses:
        "200":
          description: Safe integration status, optionally resolved to one scope.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /v1/capabilities:
    get:
      tags: [Discovery]
      summary: Discover safe capabilities for one client and Ad Account
      description: |
        Returns static supported campaign kinds plus currently accessible dynamic
        Meta assets and actionable capability gaps for the resolved scope. Dynamic
        IDs are opaque and are revalidated at proposal creation and execution.
        Assets are deterministically paginated; cursors bind the authenticated caller,
        client/account scope, and a hash of the optional asset-type filter.
        This endpoint performs no mutation, proposal creation, approval, or execution.
        Diagnosed Meta configuration and asset-access gaps return 200; 403 is only
        for local caller authorization failure. Any Meta validation call and its
        normalized outcome are audited with the request correlation ID.
      operationId: getCapabilities
      security:
        - ServiceBearer: []
      x-requirements:
        [FR-1, FR-2, FR-3, FR-8, SEC-3, SEC-7, SEC-8, NFR-4, NFR-8]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CapabilityAssetType"
      responses:
        "200":
          description: Safe discovery metadata and capability status for the resolved scope.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "400":
          $ref: "#/components/responses/CapabilityBadRequest"
        "401":
          $ref: "#/components/responses/CapabilityUnauthorized"
        "403":
          $ref: "#/components/responses/CapabilityForbidden"
        "409":
          $ref: "#/components/responses/CapabilityScopeConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /v1/campaigns:
    get:
      tags: [Reporting]
      summary: List campaigns for an Ad Account
      description: Resolves the exact pair before the audited Meta v26.0 read.
      operationId: listCampaigns
      x-requirements: [FR-1, FR-7, SEC-7, NFR-4]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Campaign page for the resolved Ad Account.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /v1/insights/query:
    post:
      tags: [Reporting]
      summary: Query Ad Account insights
      description: |
        Every metric is available with a typed value or unavailable with a reason;
        absence is never a fabricated zero. A valid query with no data returns a 200
        page with an empty data array. 422 is only for a semantically unsupported
        query or metric. Cursor binding includes caller, scope, filters, and request hash.
      operationId: queryInsights
      x-requirements: [FR-4, FR-7, SEC-7, NFR-4]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsQuery"
      responses:
        "200":
          description: Insights page, including an empty page for valid no-data queries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "422":
          $ref: "#/components/responses/UnsupportedQuery"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /v1/budget-pacing:
    get:
      tags: [Reporting]
      summary: Get monthly budget pacing for one Ad Account
      description: |
        Returns one independently scoped pacing result. The account's Meta timezone
        defines month boundaries. If timezone is unavailable, reporting_month and all
        derived fields are unavailable as one correlated variant. At exact month start,
        elapsed_fraction and expected_spend_to_date are zero; only projection is unavailable.
      operationId: getBudgetPacing
      x-requirements: [FR-12, FR-13, FR-14, FR-18, FR-19]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
        - name: as_of
          in: query
          description: Reporting instant; defaults to the server's current instant.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Correlated available or timezone-unavailable pacing result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPacingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /v1/media:
    post:
      tags: [Media]
      summary: Stage a trusted OpenClaw chat attachment
      description: |
        Accepts multipart binary only, never a local path or URL. The service verifies
        actual content type and limits, hashes bytes, and stages privately. Media is
        scope-bound and removed no later than 12 hours after staging or when its linked
        operation completes or expires, whichever is earlier.
      operationId: stageMedia
      x-requirements: [FR-1, FR-3, FR-6, SEC-3]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
            encoding:
              file:
                contentType: image/jpeg, image/png, video/mp4
              attachment:
                contentType: application/json
      responses:
        "201":
          description: Attachment validated and staged.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableMedia"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/operations:
    post:
      tags: [Operations]
      summary: Create an immutable mutation proposal
      description: |
        Creates a typed pending operation; it does not execute it. Meta validate-only
        preflight is used where applicable before persistent creation and is audited,
        but never replaces owner approval. expires_at is exactly created_at + 12 hours.
        Idempotency-Key binds authenticated caller, operation type, client/account, and
        canonical payload hash. Same key and payload returns the existing operation;
        different payload returns 409 idempotency_conflict. The key remains reserved
        with immutable operation and audit history; there is no short replay window.
      operationId: createOperation
      x-requirements: [FR-5, SEC-5, SEC-6, NFR-3, NFR-8]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperationRequest"
      responses:
        "200":
          description: Same idempotency key and canonical payload; existing operation returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "201":
          description: Immutable pending proposal created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CreateOperationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableOperation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/operations/{operation_id}:
    get:
      tags: [Operations]
      summary: Get operation status
      operationId: getOperation
      x-requirements: [FR-1, FR-2, NFR-3]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
      responses:
        "200":
          description: Current immutable proposal and separately recorded lifecycle state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScopeConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/operations/{operation_id}/approve:
    post:
      tags: [Operations]
      summary: Approve and execute an operation
      description: |
        OWNER-COMMAND ONLY through deterministic `/approve-ad`, outside model dispatch.
        The request has no body: Transfer-Encoding, non-canonical/nonzero Content-Length,
        or any parsed body is rejected before decision processing.
        Durable global and owner rate limits reject excess attempts before proof processing
        with 429 and Retry-After.
        Approval is accepted only while now < expires_at; equality is expired. Before
        at-most-once execution, scope, budget, Meta authority, integration generation,
        and bound media hashes are revalidated. Decision and execution are audited.
      operationId: approveOperation
      x-requirements: [FR-5, SEC-5, SEC-6, NFR-3, NFR-4, NFR-9]
      x-owner-command-only: true
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
        - $ref: "#/components/parameters/OwnerCommandProof"
      responses:
        "200":
          description: Execution completed, or the completed idempotent result is returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedOperationResponse"
        "202":
          description: Approval accepted; operation remains pending or is executing.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationLifecycleConflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/operations/{operation_id}/reject:
    post:
      tags: [Operations]
      summary: Reject an operation
      description: |
        OWNER-COMMAND ONLY through deterministic `/reject-ad`, outside model dispatch.
        The request has no body: Transfer-Encoding, non-canonical/nonzero Content-Length,
        or any parsed body is rejected before decision processing.
        Durable global and owner rate limits reject excess attempts before proof processing
        with 429 and Retry-After.
        Rejection is separate from approval, valid only while now < expires_at,
        idempotent, immutable, audited, and permanently prevents execution.
      operationId: rejectOperation
      x-requirements: [SEC-5, SEC-6, NFR-3, NFR-4]
      x-owner-command-only: true
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/AdAccountIdQuery"
        - $ref: "#/components/parameters/OwnerCommandProof"
      responses:
        "200":
          description: Rejection recorded or identical rejection already recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationLifecycleConflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      schema:
        $ref: "#/components/schemas/RequestId"
    ClientIdQuery:
      name: client_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AdAccountIdQuery:
      name: ad_account_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OptionalClientIdQuery:
      name: client_id
      in: query
      schema:
        $ref: "#/components/schemas/Identifier"
    OptionalAdAccountIdQuery:
      name: ad_account_id
      in: query
      schema:
        $ref: "#/components/schemas/Identifier"
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor bound to authenticated caller, resolved scope when applicable,
        filters, and request hash. Mismatched reuse returns 400.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CapabilityAssetType:
      name: asset_type
      in: query
      description: Optional asset discriminator. Its exact value is included in the cursor filter hash.
      schema:
        $ref: "#/components/schemas/CapabilityAssetType"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Permanently reserved opaque proposal identity key.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OwnerCommandProof:
      name: X-OpenClaw-Owner-Command
      in: header
      required: true
      description: Short-lived proof unavailable to model dispatch and never logged or returned.
      schema:
        type: string
        minLength: 32
        maxLength: 512

  headers:
    RequestId:
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"

  responses:
    CapabilityBadRequest:
      description: |
        Invalid capability query or cursor binding. `resolved_scope` is forbidden.
        Each supplied query ID is copied to `supplied_scope` exactly as received,
        without normalization, substitution, or resolved labels; omitted IDs are not invented.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CapabilityProblem400"
    CapabilityUnauthorized:
      description: |
        Service bearer is missing or invalid. `resolved_scope` is forbidden. Any
        supplied query IDs are preserved exactly without disclosing resolved labels.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CapabilityProblem401"
    CapabilityForbidden:
      description: |
        Authenticated local caller lacks authority. `resolved_scope` is forbidden. Any
        supplied query IDs are preserved exactly without disclosing resolved labels.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CapabilityProblem403"
    CapabilityScopeConflict:
      description: |
        Supplied client and Ad Account do not resolve to the same authorized scope.
        `resolved_scope` is forbidden and `supplied_scope` preserves both required
        query values exactly, without normalization, substitution, or resolved labels.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CapabilityProblem409"
    BadRequest:
      description: Invalid input, scope pair, or cursor binding.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem400"
    Unauthorized:
      description: Service bearer is missing or invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem401"
    Forbidden:
      description: Authenticated local caller lacks authority.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem403"
    NotFound:
      description: Supplied resource was not found or visible in its scope.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem404"
    ScopeConflict:
      description: Supplied client and Ad Account do not resolve to the same authorized scope.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem409Scope"
    CreateOperationConflict:
      description: Scope mismatch or idempotency key reuse with a different canonical payload.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem409CreateOperation"
    OperationLifecycleConflict:
      description: Scope mismatch or operation state prevents the requested lifecycle transition.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem409OperationLifecycle"
    Gone:
      description: Operation expired because now is equal to or later than expires_at.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem410"
    PayloadTooLarge:
      description: Attachment exceeds an applicable limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem413"
    UnsupportedQuery:
      description: Query or requested metric is semantically unsupported.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem422Query"
    UnprocessableMedia:
      description: Media is unsupported, mismatched, expired, wrong-scope, or hash-invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem422Media"
    UnprocessableOperation:
      description: Operation payload, campaign combination, preflight, or bound assets are semantically invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem422Operation"
    RateLimited:
      description: Local or Meta request rate exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
          description: Nonnegative delay in whole seconds serialized as an HTTP header string.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem429"
    UpstreamError:
      description: Normalized Meta upstream failure; raw bodies and secrets are excluded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem502"
    InternalError:
      description: A normalized internal service failure with no secret or implementation detail.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem500"

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 255
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Base-10 decimal string, never binary floating point.
    Ratio:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)\.\d{6}$'
      description: Ratio, rate, or fraction rounded to 6 decimal places using round-half-even.
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          $ref: "#/components/schemas/Currency"
      description: Amount rounded to the ISO 4217 currency minor unit using round-half-even.
    PositiveMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(?:0\.\d*[1-9]\d*|[1-9]\d*(?:\.\d+)?)$'
        currency:
          $ref: "#/components/schemas/Currency"
    Health:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status:
          const: ok
        time:
          type: string
          format: date-time
    ResolvedScope:
      type: object
      additionalProperties: false
      required: [client_id, client_name, ad_account_id, ad_account_name]
      properties:
        client_id:
          $ref: "#/components/schemas/Identifier"
        client_name:
          type: string
          minLength: 1
        ad_account_id:
          $ref: "#/components/schemas/Identifier"
        ad_account_name:
          type: string
          minLength: 1
        currency:
          $ref: "#/components/schemas/Currency"
        timezone:
          type: string
          description: IANA timezone reported by Meta when available.
    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
    ScopePage:
      type: object
      additionalProperties: false
      required: [request_id, data, page]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedScope"
        page:
          $ref: "#/components/schemas/PageInfo"

    IntegrationState:
      type: string
      enum:
        [
          registered,
          validating,
          active,
          configuration_required,
          reauthorization_required,
          asset_access_required,
        ]
    Diagnostic:
      type: object
      additionalProperties: false
      required: [code, message, remediation]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
        remediation:
          type: string
          minLength: 1
    MetaPermission:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,127}$"
      description: Safe Meta permission name, including newly observed permissions; never a token, secret, credential, or authorization value.
    IntegrationStatus:
      type: object
      additionalProperties: false
      required:
        [
          integration_id,
          generation,
          state,
          checked_at,
          missing_permissions,
          diagnostics,
        ]
      properties:
        integration_id:
          $ref: "#/components/schemas/Identifier"
        generation:
          $ref: "#/components/schemas/Identifier"
        state:
          $ref: "#/components/schemas/IntegrationState"
        checked_at:
          type: string
          format: date-time
        missing_permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MetaPermission"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
    IntegrationStatusResponse:
      type: object
      additionalProperties: false
      required: [request_id, integration]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        scope:
          $ref: "#/components/schemas/ResolvedScope"
        integration:
          $ref: "#/components/schemas/IntegrationStatus"

    CampaignKind:
      type: string
      enum: [SALES_WEBSITE, LEADS_WEBSITE, LEADS_INSTANT_FORM]
    CapabilityAvailability:
      type: string
      enum: [available, unavailable]
    CapabilityCheck:
      type: object
      additionalProperties: false
      required: [status, diagnostic_codes]
      properties:
        status:
          $ref: "#/components/schemas/CapabilityAvailability"
        diagnostic_codes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
          description: |
            When status is unavailable, each code MUST match exactly one `gaps[].code`;
            available capabilities use an empty array. Gap codes are unique within a response.
    CapabilityMatrix:
      type: object
      additionalProperties: false
      required:
        [
          reads,
          sales_website,
          leads_website,
          leads_instant_form,
          media_upload,
          proposal_creation,
        ]
      properties:
        reads: { $ref: "#/components/schemas/CapabilityCheck" }
        sales_website: { $ref: "#/components/schemas/CapabilityCheck" }
        leads_website: { $ref: "#/components/schemas/CapabilityCheck" }
        leads_instant_form: { $ref: "#/components/schemas/CapabilityCheck" }
        media_upload: { $ref: "#/components/schemas/CapabilityCheck" }
        proposal_creation: { $ref: "#/components/schemas/CapabilityCheck" }
    CapabilityAccount:
      type: object
      additionalProperties: false
      required: [currency, timezone]
      properties:
        currency:
          oneOf: [{ $ref: "#/components/schemas/Currency" }, { type: "null" }]
          description: Null only when unavailable and accompanied by gap code account_currency_unavailable; never fabricated.
        timezone:
          type: [string, "null"]
          minLength: 1
          description: Meta-configured IANA timezone, or null with gap code account_timezone_unavailable; never fabricated.
    CapabilityAssetType:
      type: string
      enum: [page, pixel, web_dataset, lead_form, instagram_account]
    PageAsset:
      type: object
      additionalProperties: false
      required: [asset_type, page_id, name]
      properties:
        asset_type: { const: page }
        page_id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1 }
    PixelAsset:
      type: object
      additionalProperties: false
      required: [asset_type, pixel_id, name]
      properties:
        asset_type: { const: pixel }
        pixel_id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1 }
    WebDatasetAsset:
      type: object
      additionalProperties: false
      required: [asset_type, pixel_id, name]
      properties:
        asset_type: { const: web_dataset }
        pixel_id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1 }
      description: Meta web datasets use pixel_id semantics in this API.
    LeadFormAsset:
      type: object
      additionalProperties: false
      required: [asset_type, lead_gen_form_id, page_id, name, published, usable]
      properties:
        asset_type: { const: lead_form }
        lead_gen_form_id: { $ref: "#/components/schemas/Identifier" }
        page_id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1 }
        published: { const: true }
        usable: { const: true }
    InstagramAccountAsset:
      type: object
      additionalProperties: false
      required: [asset_type, instagram_account_id, name]
      properties:
        asset_type: { const: instagram_account }
        instagram_account_id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1 }
        page_id: { $ref: "#/components/schemas/Identifier" }
    CapabilityAsset:
      oneOf:
        - $ref: "#/components/schemas/PageAsset"
        - $ref: "#/components/schemas/PixelAsset"
        - $ref: "#/components/schemas/WebDatasetAsset"
        - $ref: "#/components/schemas/LeadFormAsset"
        - $ref: "#/components/schemas/InstagramAccountAsset"
      discriminator:
        propertyName: asset_type
        mapping:
          page: "#/components/schemas/PageAsset"
          pixel: "#/components/schemas/PixelAsset"
          web_dataset: "#/components/schemas/WebDatasetAsset"
          lead_form: "#/components/schemas/LeadFormAsset"
          instagram_account: "#/components/schemas/InstagramAccountAsset"
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        [
          request_id,
          scope,
          integration,
          account,
          supported_campaign_kinds,
          assets,
          page,
          capabilities,
          gaps,
        ]
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        scope: { $ref: "#/components/schemas/ResolvedScope" }
        integration: { $ref: "#/components/schemas/IntegrationStatus" }
        account: { $ref: "#/components/schemas/CapabilityAccount" }
        supported_campaign_kinds:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/CampaignKind" }
          description: Exactly SALES_WEBSITE, LEADS_WEBSITE, and LEADS_INSTANT_FORM.
        assets:
          type: array
          items: { $ref: "#/components/schemas/CapabilityAsset" }
          description: |
            One deterministic page of accessible assets only. Order is stable by
            asset_type then opaque asset ID. IDs confer no authority.
        page: { $ref: "#/components/schemas/PageInfo" }
        capabilities: { $ref: "#/components/schemas/CapabilityMatrix" }
        gaps:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Diagnostic" }
          description: |
            Actionable reasons and remediation only; codes are unique and never contain
            tokens, secrets, or authorization material. Every unavailable capability
            diagnostic code matches exactly one entry here. Null currency and timezone
            require account_currency_unavailable and account_timezone_unavailable respectively.
      allOf:
        - if:
            properties:
              account:
                type: object
                required: [currency]
                properties: { currency: { type: "null" } }
          then:
            properties:
              gaps:
                contains:
                  {
                    type: object,
                    required: [code],
                    properties:
                      { code: { const: account_currency_unavailable } },
                  }
        - if:
            properties:
              account:
                type: object
                required: [timezone]
                properties: { timezone: { type: "null" } }
          then:
            properties:
              gaps:
                contains:
                  {
                    type: object,
                    required: [code],
                    properties:
                      { code: { const: account_timezone_unavailable } },
                  }

    DeliveryStatus:
      type: string
      enum: [ACTIVE, PAUSED, ARCHIVED, DELETED]
    Campaign:
      type: object
      additionalProperties: false
      required: [campaign_id, name, status, objective]
      properties:
        campaign_id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        objective:
          type: string
          enum: [OUTCOME_SALES, OUTCOME_LEADS]
        daily_budget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        lifetime_budget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    CampaignPage:
      type: object
      additionalProperties: false
      required: [request_id, scope, data, page]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        scope:
          $ref: "#/components/schemas/ResolvedScope"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        page:
          $ref: "#/components/schemas/PageInfo"

    DateRange:
      type: object
      additionalProperties: false
      required: [since, until]
      properties:
        since:
          type: string
          format: date
        until:
          type: string
          format: date
    InsightsQuery:
      type: object
      additionalProperties: false
      required: [client_id, ad_account_id, date_range, level]
      properties:
        client_id:
          $ref: "#/components/schemas/Identifier"
        ad_account_id:
          $ref: "#/components/schemas/Identifier"
        date_range:
          $ref: "#/components/schemas/DateRange"
        level:
          type: string
          enum: [account, campaign, ad_set, ad]
    MetricUnavailable:
      type: object
      additionalProperties: false
      required: [available, reason, detail]
      properties:
        available:
          const: false
        reason:
          type: string
          enum:
            [
              action_type_not_applicable,
              attribution_not_available,
              permission_missing,
              value_not_reported,
              value_data_missing,
              zero_denominator,
            ]
        detail:
          type: string
    DecimalMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [available, value]
          properties:
            available:
              const: true
            value:
              $ref: "#/components/schemas/Ratio"
        - $ref: "#/components/schemas/MetricUnavailable"
    IntegerMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [available, value]
          properties:
            available:
              const: true
            value:
              type: integer
              minimum: 0
        - $ref: "#/components/schemas/MetricUnavailable"
    MoneyMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [available, value]
          properties:
            available:
              const: true
            value:
              $ref: "#/components/schemas/Money"
        - $ref: "#/components/schemas/MetricUnavailable"
    InsightMetrics:
      type: object
      additionalProperties: false
      required:
        [
          spend,
          impressions,
          reach,
          clicks,
          ctr,
          cpc,
          cpm,
          results,
          conversions,
          cost_per_result,
          roas,
        ]
      properties:
        spend:
          $ref: "#/components/schemas/MoneyMetric"
        impressions:
          $ref: "#/components/schemas/IntegerMetric"
        reach:
          $ref: "#/components/schemas/IntegerMetric"
        clicks:
          $ref: "#/components/schemas/IntegerMetric"
        ctr:
          $ref: "#/components/schemas/DecimalMetric"
        cpc:
          $ref: "#/components/schemas/MoneyMetric"
        cpm:
          $ref: "#/components/schemas/MoneyMetric"
        results:
          $ref: "#/components/schemas/DecimalMetric"
        conversions:
          $ref: "#/components/schemas/DecimalMetric"
        cost_per_result:
          $ref: "#/components/schemas/MoneyMetric"
        roas:
          $ref: "#/components/schemas/DecimalMetric"
    InsightRow:
      type: object
      additionalProperties: false
      required: [entity_id, entity_name, date_range, metrics]
      properties:
        entity_id:
          $ref: "#/components/schemas/Identifier"
        entity_name:
          type: string
        date_range:
          $ref: "#/components/schemas/DateRange"
        metrics:
          $ref: "#/components/schemas/InsightMetrics"
    InsightsResponse:
      type: object
      additionalProperties: false
      required: [request_id, scope, level, date_range, data, page]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        scope:
          $ref: "#/components/schemas/ResolvedScope"
        level:
          type: string
          enum: [account, campaign, ad_set, ad]
        date_range:
          $ref: "#/components/schemas/DateRange"
        data:
          type: array
          items:
            $ref: "#/components/schemas/InsightRow"
        page:
          $ref: "#/components/schemas/PageInfo"

    PacingUnavailable:
      type: object
      additionalProperties: false
      required: [available, reason, detail]
      properties:
        available: { const: false }
        reason:
          { type: string, enum: [budget_not_configured, spend_unavailable] }
        detail: { type: string }
    PacingMoneyAvailable:
      type: object
      additionalProperties: false
      required: [available, value]
      properties:
        available: { const: true }
        value: { $ref: "#/components/schemas/Money" }
    PacingMoney:
      oneOf:
        [
          { $ref: "#/components/schemas/PacingMoneyAvailable" },
          { $ref: "#/components/schemas/PacingUnavailable" },
        ]
    PacingProjection:
      oneOf:
        - $ref: "#/components/schemas/PacingMoneyAvailable"
        - type: object
          additionalProperties: false
          required: [available, reason, detail]
          properties:
            available: { const: false }
            reason:
              { type: string, enum: [month_just_started, spend_unavailable] }
            detail: { type: string }
    BudgetPacingAvailable:
      type: object
      additionalProperties: false
      required:
        [
          availability,
          scope,
          timezone,
          currency,
          reporting_month,
          as_of,
          pacing_policy,
          monthly_budget,
          mtd_spend,
          remaining,
          elapsed_fraction,
          expected_spend_to_date,
          variance,
          projected_month_end_spend,
        ]
      properties:
        availability: { const: available }
        scope: { $ref: "#/components/schemas/ResolvedScope" }
        timezone: { type: string, description: Meta-configured IANA timezone. }
        currency: { $ref: "#/components/schemas/Currency" }
        reporting_month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        as_of: { type: string, format: date-time }
        pacing_policy: { const: linear_elapsed_time }
        monthly_budget: { $ref: "#/components/schemas/PacingMoney" }
        mtd_spend: { $ref: "#/components/schemas/PacingMoney" }
        remaining: { $ref: "#/components/schemas/PacingMoney" }
        elapsed_fraction: { $ref: "#/components/schemas/Ratio" }
        expected_spend_to_date:
          { $ref: "#/components/schemas/PacingMoneyAvailable" }
        variance: { $ref: "#/components/schemas/PacingMoney" }
        projected_month_end_spend:
          { $ref: "#/components/schemas/PacingProjection" }
    TimezoneUnavailableValue:
      type: object
      additionalProperties: false
      required: [available, reason, detail]
      properties:
        available: { const: false }
        reason: { const: timezone_unavailable }
        detail: { type: string }
    BudgetPacingTimezoneUnavailable:
      type: object
      additionalProperties: false
      required:
        [
          availability,
          scope,
          currency,
          reporting_month,
          as_of,
          pacing_policy,
          monthly_budget,
          mtd_spend,
          remaining,
          elapsed_fraction,
          expected_spend_to_date,
          variance,
          projected_month_end_spend,
          reason,
          detail,
        ]
      properties:
        availability: { const: unavailable }
        scope: { $ref: "#/components/schemas/ResolvedScope" }
        currency: { $ref: "#/components/schemas/Currency" }
        reporting_month:
          { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        as_of: { type: string, format: date-time }
        pacing_policy: { const: linear_elapsed_time }
        monthly_budget: { $ref: "#/components/schemas/PacingMoneyAvailable" }
        mtd_spend: { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        remaining: { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        elapsed_fraction:
          { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        expected_spend_to_date:
          { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        variance: { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        projected_month_end_spend:
          { $ref: "#/components/schemas/TimezoneUnavailableValue" }
        reason: { const: timezone_unavailable }
        detail: { type: string }
      description: Timezone-dependent values are explicitly unavailable; currency and monthly budget remain available independently.
    BudgetPacingResponse:
      type: object
      additionalProperties: false
      required: [request_id, pacing]
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        pacing:
          oneOf:
            [
              { $ref: "#/components/schemas/BudgetPacingAvailable" },
              { $ref: "#/components/schemas/BudgetPacingTimezoneUnavailable" },
            ]
          discriminator:
            propertyName: availability
            mapping:
              available: "#/components/schemas/BudgetPacingAvailable"
              unavailable: "#/components/schemas/BudgetPacingTimezoneUnavailable"

    AttachmentMetadata:
      type: object
      additionalProperties: false
      required:
        [source, attachment_id, original_filename, declared_content_type]
      properties:
        source: { const: openclaw_chat_attachment }
        attachment_id: { $ref: "#/components/schemas/Identifier" }
        original_filename:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\\x00-\x1F\x7F]+$'
          description: Basename display metadata only; slash, backslash, and control characters are rejected. Never interpreted as a path.
        declared_content_type:
          { type: string, enum: [image/jpeg, image/png, video/mp4] }
        alt_text: { type: string, maxLength: 1000 }
    MediaUpload:
      type: object
      additionalProperties: false
      required: [client_id, ad_account_id, file, attachment]
      properties:
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
        file: { type: string, format: binary }
        attachment: { $ref: "#/components/schemas/AttachmentMetadata" }
    StagedMedia:
      type: object
      additionalProperties: false
      required:
        [
          media_id,
          sha256,
          status,
          media_type,
          content_type,
          size_bytes,
          created_at,
          expires_at,
        ]
      properties:
        media_id: { $ref: "#/components/schemas/Identifier" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status:
          { type: string, enum: [staged, bound, consumed, expired, invalid] }
        media_type: { type: string, enum: [image, video] }
        content_type: { type: string, enum: [image/jpeg, image/png, video/mp4] }
        size_bytes: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        operation_id:
          oneOf: [{ $ref: "#/components/schemas/Identifier" }, { type: "null" }]
    MediaResponse:
      type: object
      additionalProperties: false
      required: [request_id, scope, media]
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        scope: { $ref: "#/components/schemas/ResolvedScope" }
        media: { $ref: "#/components/schemas/StagedMedia" }

    CreateOperationRequest:
      oneOf:
        [
          { $ref: "#/components/schemas/CreateCampaignOperationRequest" },
          { $ref: "#/components/schemas/UpdateObjectOperationRequest" },
          { $ref: "#/components/schemas/ChangeDeliveryOperationRequest" },
          {
            $ref: "#/components/schemas/ConfigureMonthlyBudgetOperationRequest",
          },
        ]
      discriminator:
        propertyName: type
        mapping:
          {
            create_campaign_bundle: "#/components/schemas/CreateCampaignOperationRequest",
            update_object: "#/components/schemas/UpdateObjectOperationRequest",
            change_delivery: "#/components/schemas/ChangeDeliveryOperationRequest",
            configure_monthly_budget: "#/components/schemas/ConfigureMonthlyBudgetOperationRequest",
          }
    CreateCampaignOperationRequest:
      type: object
      additionalProperties: false
      required: [type, client_id, ad_account_id, payload]
      properties:
        type: { const: create_campaign_bundle }
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
        payload: { $ref: "#/components/schemas/CampaignBundleProposal" }
    UpdateObjectOperationRequest:
      type: object
      additionalProperties: false
      required: [type, client_id, ad_account_id, payload]
      properties:
        type: { const: update_object }
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
        payload: { $ref: "#/components/schemas/UpdateObjectPayload" }
    ChangeDeliveryOperationRequest:
      type: object
      additionalProperties: false
      required: [type, client_id, ad_account_id, payload]
      properties:
        type: { const: change_delivery }
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
        payload: { $ref: "#/components/schemas/ChangeDeliveryPayload" }
    ConfigureMonthlyBudgetOperationRequest:
      type: object
      additionalProperties: false
      required: [type, client_id, ad_account_id, payload]
      properties:
        type: { const: configure_monthly_budget }
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
        payload: { $ref: "#/components/schemas/MonthlyBudgetPayload" }

    CampaignBundleProposal:
      type: object
      additionalProperties: false
      required: [campaign_kind, campaign, ad_set, creative, ad]
      allOf:
        - if:
            properties:
              campaign:
                properties:
                  budget:
                    properties: { kind: { const: lifetime } }
                    required: [kind]
                required: [budget]
            required: [campaign]
          then:
            properties:
              ad_set: { required: [end_time] }
      properties:
        campaign_kind:
          $ref: "#/components/schemas/CampaignKind"
          description: Selects the fixed objective, destination, optimization goal, billing event, conversion event, and required assets.
        campaign: { $ref: "#/components/schemas/CampaignProposal" }
        ad_set: { $ref: "#/components/schemas/AdSetProposal" }
        creative: { $ref: "#/components/schemas/CreativeProposal" }
        ad: { $ref: "#/components/schemas/AdProposal" }
      description: |
        Fixed internal mappings: SALES_WEBSITE = OUTCOME_SALES + WEBSITE +
        OFFSITE_CONVERSIONS + IMPRESSIONS + pixel_id + PURCHASE + website URL;
        LEADS_WEBSITE = OUTCOME_LEADS + WEBSITE + OFFSITE_CONVERSIONS + IMPRESSIONS
        + pixel_id + LEAD + website URL; LEADS_INSTANT_FORM = OUTCOME_LEADS + ON_AD
        + LEAD_GENERATION + IMPRESSIONS + page_id + published lead_gen_form_id.
        Form and page must match. Callers cannot supply those derived Meta values.
    CampaignProposal:
      type: object
      additionalProperties: false
      required: [name, budget]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        budget:
          oneOf:
            [
              { $ref: "#/components/schemas/DailyBudget" },
              { $ref: "#/components/schemas/LifetimeBudget" },
            ]
          discriminator:
            propertyName: kind
            mapping:
              {
                daily: "#/components/schemas/DailyBudget",
                lifetime: "#/components/schemas/LifetimeBudget",
              }
    DailyBudget:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { const: daily }
        value: { $ref: "#/components/schemas/PositiveMoney" }
    LifetimeBudget:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { const: lifetime }
        value: { $ref: "#/components/schemas/PositiveMoney" }
    AdSetProposal:
      type: object
      additionalProperties: false
      required: [name, targeting]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        pixel_id: { $ref: "#/components/schemas/Identifier" }
        lead_gen_form_id: { $ref: "#/components/schemas/Identifier" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        targeting: { $ref: "#/components/schemas/Targeting" }
      description: Runtime validation requires pixel_id for website variants or a published matching lead_gen_form_id for instant forms.
    Targeting:
      type: object
      additionalProperties: false
      required: [countries, minimum_age, maximum_age]
      properties:
        countries:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[A-Z]{2}$" }
        minimum_age: { type: integer, minimum: 18, maximum: 65 }
        maximum_age: { type: integer, minimum: 18, maximum: 65 }
    CreativeProposal:
      type: object
      additionalProperties: false
      required: [name, page_id, message, call_to_action, media]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        page_id: { $ref: "#/components/schemas/Identifier" }
        instagram_account_id: { $ref: "#/components/schemas/Identifier" }
        message: { type: string, minLength: 1, maxLength: 5000 }
        headline: { type: string, maxLength: 255 }
        website_url: { type: string, format: uri, pattern: "^https://" }
        call_to_action:
          type: string
          enum:
            [
              SHOP_NOW,
              BUY_NOW,
              ORDER_NOW,
              ADD_TO_CART,
              LEARN_MORE,
              GET_OFFER,
              SUBSCRIBE,
              SIGN_UP,
              APPLY_NOW,
              GET_QUOTE,
              CONTACT_US,
              BOOK_NOW,
              GET_STARTED,
            ]
          description: Union allowlist; runtime validation enforces Sales or Leads variant-specific subset.
        media:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MediaBinding" }
    MediaBinding:
      type: object
      additionalProperties: false
      required: [media_id, sha256]
      properties:
        media_id: { $ref: "#/components/schemas/Identifier" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    AdProposal:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    UpdateObjectPayload:
      oneOf:
        [
          { $ref: "#/components/schemas/UpdateCampaignPayload" },
          { $ref: "#/components/schemas/UpdateAdSetPayload" },
          { $ref: "#/components/schemas/UpdateAdPayload" },
        ]
      discriminator:
        propertyName: object_type
        mapping:
          {
            campaign: "#/components/schemas/UpdateCampaignPayload",
            ad_set: "#/components/schemas/UpdateAdSetPayload",
            ad: "#/components/schemas/UpdateAdPayload",
          }
    UpdateCampaignPayload:
      type: object
      additionalProperties: false
      required: [object_type, object_id, changes]
      properties:
        object_type: { const: campaign }
        object_id: { $ref: "#/components/schemas/Identifier" }
        changes: { $ref: "#/components/schemas/CampaignChanges" }
    CampaignChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        budget:
          oneOf:
            [
              { $ref: "#/components/schemas/DailyBudget" },
              { $ref: "#/components/schemas/LifetimeBudget" },
            ]
    UpdateAdSetPayload:
      type: object
      additionalProperties: false
      required: [object_type, object_id, changes]
      properties:
        object_type: { const: ad_set }
        object_id: { $ref: "#/components/schemas/Identifier" }
        changes: { $ref: "#/components/schemas/AdSetChanges" }
    AdSetChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        targeting: { $ref: "#/components/schemas/Targeting" }
    UpdateAdPayload:
      type: object
      additionalProperties: false
      required: [object_type, object_id, changes]
      properties:
        object_type: { const: ad }
        object_id: { $ref: "#/components/schemas/Identifier" }
        changes: { $ref: "#/components/schemas/AdChanges" }
    AdChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    ChangeDeliveryPayload:
      type: object
      additionalProperties: false
      required: [action, object_type, object_id]
      properties:
        action: { type: string, enum: [ACTIVATE, PAUSE, RESUME] }
        object_type: { type: string, enum: [Campaign, AdSet, Ad] }
        object_id: { $ref: "#/components/schemas/Identifier" }
    MonthlyBudgetPayload:
      type: object
      additionalProperties: false
      required: [monthly_budget]
      properties:
        monthly_budget: { $ref: "#/components/schemas/PositiveMoney" }

    OperationStatus:
      type: string
      enum: [pending, executing, succeeded, rejected, expired, stale, failed]
    OperationBase:
      type: object
      required:
        [
          operation_id,
          type,
          status,
          scope,
          integration_generation,
          payload_hash,
          review,
          next_action,
          created_at,
          expires_at,
        ]
      properties:
        operation_id: { $ref: "#/components/schemas/Identifier" }
        type: { type: string }
        status: { $ref: "#/components/schemas/OperationStatus" }
        scope: { $ref: "#/components/schemas/ResolvedScope" }
        integration_generation: { $ref: "#/components/schemas/Identifier" }
        payload_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        review: { $ref: "#/components/schemas/OperationReview" }
        next_action: { $ref: "#/components/schemas/NextAction" }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Exactly created_at + 12 hours; valid only while now is earlier.
        decision:
          oneOf:
            [
              { $ref: "#/components/schemas/OperationDecision" },
              { type: "null" },
            ]
        result:
          oneOf: [{ type: "null" }, { type: object }]
    OperationReview:
      oneOf:
        - { $ref: "#/components/schemas/CampaignBundleProposal" }
        - { $ref: "#/components/schemas/UpdateObjectPayload" }
        - { $ref: "#/components/schemas/ChangeDeliveryPayload" }
        - { $ref: "#/components/schemas/MonthlyBudgetPayload" }
    NextAction:
      type: string
      enum: [approve_or_reject, wait, reconcile_manually_no_automatic_replay, retry_new_operation, fix_input, no_action]
    TypedOperation:
      oneOf:
        [
          { $ref: "#/components/schemas/CreateCampaignOperation" },
          { $ref: "#/components/schemas/UpdateObjectOperation" },
          { $ref: "#/components/schemas/ChangeDeliveryOperation" },
          { $ref: "#/components/schemas/ConfigureMonthlyBudgetOperation" },
        ]
      discriminator:
        propertyName: type
        mapping:
          {
            create_campaign_bundle: "#/components/schemas/CreateCampaignOperation",
            update_object: "#/components/schemas/UpdateObjectOperation",
            change_delivery: "#/components/schemas/ChangeDeliveryOperation",
            configure_monthly_budget: "#/components/schemas/ConfigureMonthlyBudgetOperation",
          }
    CreateCampaignOperation:
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - type: object
          properties:
            type: { const: create_campaign_bundle }
            review: { $ref: "#/components/schemas/CampaignBundleProposal" }
            result:
              oneOf:
                [
                  { $ref: "#/components/schemas/CreateCampaignResult" },
                   { $ref: "#/components/schemas/MutationFailed" },
                   { $ref: "#/components/schemas/ExecutionProgress" },
                   { $ref: "#/components/schemas/StaleExecutionProgress" },
                  { type: "null" },
                ]
    UpdateObjectOperation:
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - type: object
          properties:
            type: { const: update_object }
            review: { $ref: "#/components/schemas/UpdateObjectPayload" }
            result:
              oneOf:
                [
                  { $ref: "#/components/schemas/MutationResult" },
                   { $ref: "#/components/schemas/ExecutionProgress" },
                   { $ref: "#/components/schemas/StaleExecutionProgress" },
                   { type: "null" },
                ]
    ChangeDeliveryOperation:
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - type: object
          properties:
            type: { const: change_delivery }
            review: { $ref: "#/components/schemas/ChangeDeliveryPayload" }
            result:
              oneOf:
                [
                  { $ref: "#/components/schemas/MutationResult" },
                   { $ref: "#/components/schemas/ExecutionProgress" },
                   { $ref: "#/components/schemas/StaleExecutionProgress" },
                   { type: "null" },
                ]
    ConfigureMonthlyBudgetOperation:
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - type: object
          properties:
            type: { const: configure_monthly_budget }
            review: { $ref: "#/components/schemas/MonthlyBudgetPayload" }
            result:
              oneOf:
                [
                  { $ref: "#/components/schemas/MutationResult" },
                   { $ref: "#/components/schemas/ExecutionProgress" },
                   { $ref: "#/components/schemas/StaleExecutionProgress" },
                   { type: "null" },
                ]
    Operation:
      oneOf:
        [
          { $ref: "#/components/schemas/PendingOperation" },
          { $ref: "#/components/schemas/ExecutingOperation" },
          { $ref: "#/components/schemas/SucceededOperation" },
          { $ref: "#/components/schemas/RejectedOperation" },
          { $ref: "#/components/schemas/ExpiredOperation" },
          { $ref: "#/components/schemas/StaleOperation" },
          { $ref: "#/components/schemas/FailedOperation" },
        ]
      discriminator:
        propertyName: status
        mapping:
          {
            pending: "#/components/schemas/PendingOperation",
            executing: "#/components/schemas/ExecutingOperation",
            succeeded: "#/components/schemas/SucceededOperation",
            rejected: "#/components/schemas/RejectedOperation",
            expired: "#/components/schemas/ExpiredOperation",
            stale: "#/components/schemas/StaleOperation",
            failed: "#/components/schemas/FailedOperation",
          }
    PendingOperation:
      unevaluatedProperties: false
      allOf:
        [
          { $ref: "#/components/schemas/TypedOperation" },
          {
            type: object,
            required: [status, result, next_action],
            properties:
              { status: { const: pending }, result: { type: "null" }, next_action: { const: approve_or_reject } },
          },
        ]
    ExecutingOperation:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/TypedOperation" }
        - type: object
          required: [status, result, execution_state, next_action]
          properties:
            status: { const: executing }
            execution_state: { type: string, enum: [active, reconciliation_required] }
            result: { $ref: "#/components/schemas/ExecutionProgress" }
            next_action: { type: string, enum: [wait, reconcile_manually_no_automatic_replay] }
    SucceededOperation:
      unevaluatedProperties: false
      allOf:
        [
          { $ref: "#/components/schemas/TypedOperation" },
          {
            type: object,
            required: [status, result, next_action],
            properties:
              {
                status: { const: succeeded },
                next_action: { const: no_action },
                result:
                  {
                    type: object,
                    required: [status],
                    properties: { status: { const: succeeded } },
                  },
              },
          },
        ]
    RejectedOperation:
      unevaluatedProperties: false
      allOf:
        [
          { $ref: "#/components/schemas/TypedOperation" },
          {
            type: object,
            required: [status, result, next_action],
            properties:
              { status: { const: rejected }, result: { type: "null" }, next_action: { const: no_action } },
          },
        ]
    ExpiredOperation:
      unevaluatedProperties: false
      allOf:
        [
          { $ref: "#/components/schemas/TypedOperation" },
          {
            type: object,
            required: [status, result, next_action],
            properties:
              { status: { const: expired }, result: { type: "null" }, next_action: { const: retry_new_operation } },
          },
        ]
    StaleOperation:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/TypedOperation" }
        - type: object
          required: [status, result, next_action]
          properties:
            status: { const: stale }
            result:
              oneOf: [{ type: "null" }, { $ref: "#/components/schemas/StaleExecutionProgress" }]
            next_action: { const: retry_new_operation }
    FailedOperation:
      unevaluatedProperties: false
      allOf:
        [
          { $ref: "#/components/schemas/TypedOperation" },
          {
            type: object,
            required: [status, result, next_action],
            properties:
              {
                status: { const: failed },
                result: { $ref: "#/components/schemas/MutationFailed" },
                next_action: { const: fix_input },
              },
          },
        ]
    OperationDecision:
      type: object
      additionalProperties: false
      required: [decision, decided_at, owner_identity]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        decided_at: { type: string, format: date-time }
        owner_identity: { type: string }
    PausedCreatedObject:
      type: object
      additionalProperties: false
      required: [object_id, delivery_status]
      properties:
        object_id: { $ref: "#/components/schemas/Identifier" }
        delivery_status: { const: PAUSED }
    BoundCreative:
      type: object
      additionalProperties: false
      required: [object_id, bound]
      properties:
        object_id: { $ref: "#/components/schemas/Identifier" }
        bound: { const: true }
    CreateCampaignResult:
      type: object
      additionalProperties: false
      required: [status, completed_at, campaign, ad_set, creative, ad, next_action]
      properties:
        status: { const: succeeded }
        completed_at: { type: string, format: date-time }
        campaign: { $ref: "#/components/schemas/PausedCreatedObject" }
        ad_set: { $ref: "#/components/schemas/PausedCreatedObject" }
        creative: { $ref: "#/components/schemas/BoundCreative" }
        ad: { $ref: "#/components/schemas/PausedCreatedObject" }
        next_action: { const: no_action }
      description: Exactly one Campaign, Ad Set, Creative, and Ad; only the three delivery objects are PAUSED.
    MutationResult:
      {
        oneOf:
          [
            { $ref: "#/components/schemas/MutationSucceeded" },
            { $ref: "#/components/schemas/MutationFailed" },
          ],
        discriminator: { propertyName: status },
      }
    MutationSucceeded:
      type: object
      additionalProperties: false
      required: [status, completed_at, next_action]
      properties:
        status: { const: succeeded }
        completed_at: { type: string, format: date-time }
        next_action: { const: no_action }
    MutationFailed:
      type: object
      additionalProperties: false
      required: [status, completed_at, failure_code, proven_resources, failed_or_ambiguous_step, next_action]
      properties:
        status: { const: failed }
        completed_at: { type: string, format: date-time }
        failure_code:
          {
            type: string,
            enum:
              [
                operation_stale,
                meta_configuration_required,
                meta_reauthorization_required,
                meta_asset_access_required,
                meta_permission_missing,
                media_invalid,
                rate_limited,
                meta_error,
              ],
          }
        proven_resources:
          type: array
          items: { $ref: "#/components/schemas/ProvenResource" }
        failed_or_ambiguous_step:
          oneOf: [{ type: string, minLength: 1, maxLength: 255 }, { type: "null" }]
        next_action: { const: fix_input }
    ProvenResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [image, video, campaign, ad_set, creative, ad, object, budget] }
        id: { $ref: "#/components/schemas/Identifier" }
    ExecutionProgress:
      oneOf:
        - { $ref: "#/components/schemas/ActiveExecutionProgress" }
        - { $ref: "#/components/schemas/ReconciliationRequiredProgress" }
    ActiveExecutionProgress:
      type: object
      additionalProperties: false
      required: [status, proven_resources, failed_or_ambiguous_step, next_action]
      properties:
        status: { const: executing }
        proven_resources: { type: array, items: { $ref: "#/components/schemas/ProvenResource" } }
        failed_or_ambiguous_step: { type: "null" }
        next_action: { const: wait }
    ReconciliationRequiredProgress:
      type: object
      additionalProperties: false
      required: [status, proven_resources, failed_or_ambiguous_step, next_action]
      properties:
        status: { const: reconciliation_required }
        proven_resources: { type: array, items: { $ref: "#/components/schemas/ProvenResource" } }
        failed_or_ambiguous_step: { type: string, minLength: 1, maxLength: 255 }
        next_action: { const: reconcile_manually_no_automatic_replay }
    StaleExecutionProgress:
      type: object
      additionalProperties: false
      required: [status, proven_resources, failed_or_ambiguous_step, next_action]
      properties:
        status: { const: stale }
        proven_resources: { type: array, items: { $ref: "#/components/schemas/ProvenResource" } }
        failed_or_ambiguous_step:
          oneOf: [{ type: string, minLength: 1, maxLength: 255 }, { type: "null" }]
        next_action: { const: retry_new_operation }
    OperationResponse:
      type: object
      additionalProperties: false
      required: [request_id, operation]
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        operation: { $ref: "#/components/schemas/Operation" }
    PendingOperationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/OperationResponse"
        - type: object
          properties:
            operation:
              allOf:
                - $ref: "#/components/schemas/Operation"
                - { type: object, properties: { status: { const: pending } } }
    AcceptedOperationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/OperationResponse"
        - type: object
          properties:
            operation:
              allOf:
                - $ref: "#/components/schemas/Operation"
                - {
                    type: object,
                    properties:
                      { status: { type: string, enum: [pending, executing] } },
                  }
    CompletedOperationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/OperationResponse"
        - type: object
          properties:
            operation:
              allOf:
                - $ref: "#/components/schemas/Operation"
                - {
                    type: object,
                    required: [status, result],
                    properties:
                      {
                        status: { type: string, enum: [succeeded, failed] },
                        result: { type: object },
                      },
                  }
    RejectedOperationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/OperationResponse"
        - type: object
          properties:
            operation:
              allOf:
                - $ref: "#/components/schemas/Operation"
                - { type: object, properties: { status: { const: rejected } } }

    SuppliedScope:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        client_id: { $ref: "#/components/schemas/Identifier" }
        ad_account_id: { $ref: "#/components/schemas/Identifier" }
      description: Preserves whichever known scope identifiers were supplied; omitted when no scope input was provided.
    CapabilitySuppliedScope:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        client_id: { type: string }
        ad_account_id: { type: string }
      description: Exact supplied query strings; values are not normalized or replaced and omitted fields are not invented.
    CapabilityRequiredSuppliedScope:
      type: object
      additionalProperties: false
      required: [client_id, ad_account_id]
      properties:
        client_id: { type: string }
        ad_account_id: { type: string }
      description: Both exact required query strings for client_account_mismatch.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    ProblemBase:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
